<!doctype html>
<html><head><meta charset="utf-8"><title>Cover B</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #f3f4f6; --ink-2: #9aa4b2; --accent: #3fd17a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1600px; height: 1200px; overflow: hidden; background: #0d1117; font-family: Inter, sans-serif; color: var(--ink); }
  .wrap { position: absolute; inset: 70px 90px 110px; text-align: center; }
  h1 { font-size: 112px; line-height: 1.02; letter-spacing: -0.03em; font-weight: 800; margin: 0; }
  h1 span { color: var(--accent); }
  .flow { display: inline-flex; align-items: center; gap: 16px; margin-top: 50px; font-size: 30px; font-weight: 700; }
  .node { border: 3px solid #3b4452; border-radius: 18px; padding: 16px 24px; background: #161b22; white-space: nowrap; }
  .gw { border-color: var(--accent); color: var(--accent); position: relative; }
  .badge { position: absolute; top: -22px; right: -18px; background: var(--accent); color: #0d1117; font-size: 19px; padding: 6px 12px; border-radius: 999px; }
  .arrow { font-size: 40px; color: var(--ink-2); }
  .browser { position: absolute; left: 40px; right: 40px; bottom: 92px; border-radius: 22px; overflow: hidden; border: 2px solid #2d333b; box-shadow: 0 30px 80px rgba(0,0,0,0.5); background: #f6f6f3; text-align: left; }
  .bar { height: 44px; background: #1f252d; display: flex; align-items: center; gap: 10px; padding: 0 18px; }
  .bar i { width: 14px; height: 14px; border-radius: 50%; background: #4b5563; display: block; }
  .shot { width: 100%; display: block; }
  .chips { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 14px; }
  .chip { font-size: 27px; font-weight: 700; padding: 11px 22px; border-radius: 999px; border: 2px solid #3b4452; color: var(--ink); }
  .tag { position: absolute; right: 0; bottom: -46px; font-size: 19px; font-weight: 600; color: var(--ink-2); }
</style></head>
<body><div class="wrap">
  <div class="tag">Built with Claude Code</div>
  <h1>Stop overpaying<br><span>for AI calls</span></h1>
  <div class="flow">
    <div class="node">Your apps</div><div class="arrow">→</div>
    <div class="node gw">Gateway<span class="badge">PII removed</span></div><div class="arrow">→</div>
    <div class="node">OpenAI</div><div class="node">Claude</div><div class="node">Gemini</div>
  </div>
  <div class="browser"><div class="bar"><i></i><i></i><i></i></div><img class="shot" src="dashboard.png"></div>
  <div class="chips"><div class="chip">Smart routing</div><div class="chip">Team budgets</div><div class="chip">Personal data removed</div></div>
</div></body></html>
