<!doctype html>
<html><head><meta charset="utf-8"><title>Cover A</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0b0b0b; --ink-2: #4a4945; --accent: #0a8a0a; --accent-bg: #e6f4e6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1600px; height: 1200px; overflow: hidden; background: #ffffff; font-family: Inter, sans-serif; color: var(--ink); }
  .wrap { position: absolute; inset: 80px 90px; }
  h1 { font-size: 104px; line-height: 1.0; letter-spacing: -0.03em; font-weight: 800; margin: 0; max-width: 1100px; }
  h1 span { color: var(--accent); }
  .chips { display: flex; gap: 14px; margin-top: 34px; }
  .chip { font-size: 28px; font-weight: 700; padding: 12px 22px; border-radius: 999px; background: var(--accent-bg); color: #0b5e0b; }
  .flow { display: flex; align-items: center; gap: 18px; margin-top: 46px; font-size: 30px; font-weight: 700; }
  .node { border: 3px solid var(--ink); border-radius: 18px; padding: 16px 24px; background: #fff; white-space: nowrap; }
  .gw { border-color: var(--accent); color: var(--accent); position: relative; }
  .badge { position: absolute; top: -22px; right: -18px; background: var(--accent); color: #fff; font-size: 19px; padding: 6px 12px; border-radius: 999px; }
  .arrow { font-size: 40px; color: var(--ink-2); }
  .vendors { display: flex; gap: 10px; }
  .browser { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 22px; overflow: hidden; border: 2px solid #d9d8d2; box-shadow: 0 24px 60px rgba(0,0,0,0.12); background: #f6f6f3; }
  .bar { height: 44px; background: #ecebe6; display: flex; align-items: center; gap: 10px; padding: 0 18px; }
  .bar i { width: 14px; height: 14px; border-radius: 50%; background: #c9c7bf; display: block; }
  .shot { width: 100%; display: block; }
  .browser .shot { height: auto; }
  .tag { position: absolute; right: 0; top: 0; font-size: 20px; font-weight: 600; color: var(--ink-2); border: 2px solid #d9d8d2; border-radius: 999px; padding: 8px 16px; }
</style></head>
<body><div class="wrap">
  <div class="tag">Built with Claude Code</div>
  <h1>Cut AI costs.<br><span>Keep data private.</span></h1>
  <div class="chips"><div class="chip">Personal data removed</div><div class="chip">Team budgets</div><div class="chip">Automatic failover</div></div>
  <div class="flow">
    <div class="node">Your apps</div><div class="arrow">→</div>
    <div class="node gw">Gateway<span class="badge">PII removed</span></div><div class="arrow">→</div>
    <div class="vendors"><div class="node">OpenAI</div><div class="node">Claude</div><div class="node">Gemini</div></div>
  </div>
  <div class="browser"><div class="bar"><i></i><i></i><i></i></div><img class="shot" src="dashboard.png"></div>
</div></body></html>
