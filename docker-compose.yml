# docker compose up  ->  gateway :8787, dashboard :3000, Redis and Postgres.
# Demo mode by default. For real providers set DEMO_MODE=0, ADMIN_TOKEN and API keys in .env.
services:
  gateway:
    build: .
    ports: ["8787:8787"]
    env_file:
      - path: .env
        required: false
    environment:
      DEMO_MODE: ${DEMO_MODE:-1}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports: ["3000:3000"]
    environment:
      GATEWAY_URL: http://gateway:8787
      DEMO_MODE: ${DEMO_MODE:-1}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on: [gateway]
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U gateway"], interval: 5s, retries: 10 }

volumes:
  pgdata:
