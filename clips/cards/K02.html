<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><title>K02</title>
<style>
.flow { display: grid; grid-template-columns: 300px 120px 640px 120px 360px; align-items: center; margin-top: 30px; }
.box { border: 4px solid var(--ink); border-radius: 28px; padding: 34px 30px; font-size: 46px; font-weight: 800; text-align: center; background: #fff; }
.gw { border-color: var(--blue); text-align: left; padding: 30px 40px; }
.gw .t { color: var(--blue); margin-bottom: 18px; }
.step { display: flex; align-items: center; gap: 18px; font-size: 38px; font-weight: 600; margin: 12px 0; }
.chk { width: 46px; height: 46px; border-radius: 12px; background: var(--green-bg); color: var(--green); display: grid; place-items: center; font-size: 30px; font-weight: 800; }
.arrow { height: 8px; background: var(--ink); position: relative; margin: 0 14px; transform-origin: left; transform: scaleX(0); transition: transform 0.5s ease; }
.arrow::after { content: ''; position: absolute; right: -4px; top: -14px; border-left: 26px solid var(--ink); border-top: 18px solid transparent; border-bottom: 18px solid transparent; }
body.go .arrow { transform: scaleX(1); }
.providers { display: grid; gap: 16px; }
.providers .box { font-size: 40px; padding: 22px; }
.back { margin: 56px 0 0 150px; width: 1460px; height: 90px; border: 8px solid var(--green); border-top: none; border-radius: 0 0 40px 40px; position: relative; opacity: 0; transition: opacity 0.6s ease; }
.back span { position: absolute; left: 50%; bottom: -70px; transform: translateX(-50%); font-size: 38px; font-weight: 700; color: var(--green); white-space: nowrap; }
body.go .back { opacity: 1; }
</style></head><body>
<div class="frame" style="padding-top: 90px">
  <div class="kicker in">How it works</div>
  <div class="flow">
    <div class="box in" style="transition-delay:0.2s">Your apps</div>
    <div class="arrow" style="transition-delay:0.8s"></div>
    <div class="box gw in" style="transition-delay:1.1s">
      <div class="t">Gateway</div>
      <div class="step in" style="transition-delay:1.7s"><span class="chk">✓</span>Remove personal data</div>
      <div class="step in" style="transition-delay:2.3s"><span class="chk">✓</span>Check team budget</div>
      <div class="step in" style="transition-delay:2.9s"><span class="chk">✓</span>Pick the cheapest model</div>
      <div class="step in" style="transition-delay:3.5s"><span class="chk">✓</span>Answer from cache</div>
    </div>
    <div class="arrow" style="transition-delay:4.1s"></div>
    <div class="providers">
      <div class="box in" style="transition-delay:4.4s">OpenAI</div>
      <div class="box in" style="transition-delay:4.6s">Claude</div>
      <div class="box in" style="transition-delay:4.8s">Gemini</div>
    </div>
  </div>
  <div class="back" style="transition-delay:5.6s"><span>Answer back to your app, personal data put back</span></div>
</div>
<script>window.play = () => document.body.classList.add('go');</script>
</body></html>
