name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://gateway:gateway@localhost:5432/gateway
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      # Actions pinned to full commit SHAs (tags can be moved; SHAs cannot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from lockfile only (install scripts disabled in .npmrc)
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Repo hygiene (no keys, no personal emails)
        run: npm run check:hygiene
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build dashboard
        run: npm run build -w dashboard
      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images
        run: docker compose build
      - name: Start stack and smoke test in demo mode
        run: |
          docker compose up -d
          for i in $(seq 1 60); do curl -fs localhost:8787/health && break; sleep 2; done
          curl -fs localhost:8787/v1/chat/completions -H 'authorization: Bearer demo-key-support' -H 'content-type: application/json' \
            -d '{"model":"auto","messages":[{"role":"user","content":"Classify this ticket: parcel lost, email jane.doe@example.com"}]}'
          for i in $(seq 1 30); do curl -fs localhost:3000/ >/dev/null && break; sleep 2; done
          curl -fs localhost:3000/api/gw/admin/summary | head -c 300
      - if: always()
        run: docker compose logs --no-color | tail -100
